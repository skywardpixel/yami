name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # the rolling release is published from this workflow

# One job, not several. macOS runners bill at 10x on a private repo, so each
# extra job is a real cost rather than a tidiness win.
#
# Only first-party actions are used here. A build that signs code and downloads
# a 43 MB binary is not somewhere to add third-party supply chain.
jobs:
  build:
    name: Build, test, bundle
    # macOS gates new UI appearance on the SDK an app is linked against, so a
    # macOS 15 SDK build runs on macOS 26 in compatibility mode and can look
    # different from a local build. Matching the runner to the current OS keeps
    # what CI ships identical to what is developed against.
    runs-on: macos-26
    timeout-minutes: 45

    env:
      # Release artefacts are only published when a Developer ID certificate is
      # available. An ad-hoc build cannot be opened after download and its
      # privileged helper rejects it, so shipping one is a trap.
      SIGNED: ${{ secrets.MACOS_CERT_P12 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      - name: Unit tests
        run: swift test

      # Keyed on the fetch script, so bumping the pinned version or its
      # checksum busts the cache instead of silently reusing the old core.
      - name: Cache the pinned mihomo core
        uses: actions/cache@v4
        with:
          path: vendor
          key: mihomo-${{ hashFiles('scripts/fetch-mihomo.sh') }}

      - name: Fetch the core
        run: ./scripts/fetch-mihomo.sh

      # Ad-hoc: no Developer ID exists for this project, and CI has no keychain.
      # Enough to prove the bundle assembles and seals; not distributable.
      # A tag names the version; anything else is identified by its commit.
      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a UI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "the imported certificate is not a Developer ID Application cert" >&2
            exit 1
          fi
          echo "YAMI_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"

      - name: Fall back to ad-hoc signing
        if: env.SIGNED != 'true'
        run: |
          echo "YAMI_IDENTITY=-" >> "$GITHUB_ENV"
          echo "::notice::No signing certificate configured — building ad-hoc and publishing no artefacts."

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            ASSET="Yami-${VERSION}.zip"
          else
            # Base version comes from Info.plist, so a canary never claims an
            # older release's number.
            BASE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              Resources/Info.plist)"
            VERSION="${BASE}-$(git rev-parse --short HEAD)"
            ASSET="Yami.zip"   # stable URL for the rolling build
          fi
          echo "YAMI_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "YAMI_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Build the app bundle
        run: ./build.sh release

      - name: Check the bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict build/Yami.app
          test -x build/Yami.app/Contents/MacOS/Yami
          test -x build/Yami.app/Contents/MacOS/dev.yami.helper
          test -x build/Yami.app/Contents/MacOS/mihomo
          test -f build/Yami.app/Contents/Library/LaunchDaemons/dev.yami.helper.plist
          test -f build/Yami.app/Contents/Resources/AppIcon.icns
          # GPL-3.0: the licence must ship whenever the core does.
          test -f build/Yami.app/Contents/Resources/mihomo-LICENSE.txt
          # Surfaced because a silent runner-image change would otherwise alter
          # the app's appearance with nothing else to show for it.
          otool -l build/Yami.app/Contents/MacOS/Yami \
            | grep -A5 LC_BUILD_VERSION | grep -E 'minos|sdk' | head -2
          echo "bundle ok"

      - name: Integration checks
        run: ./scripts/verify.sh

      - name: Upload the app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Yami.app
          path: build/Yami.app
          retention-days: 7

      # Must run before packaging: stapling writes the ticket into the bundle,
      # and the zip has to carry it so an offline machine can validate.
      - name: Notarize and staple
        if: env.SIGNED == 'true' && github.event_name == 'push'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/Yami.app "$RUNNER_TEMP/notarize.zip"

          # notarytool takes either an App Store Connect API key or an Apple ID
          # with an app-specific password. Neither has anything to do with the
          # App Store; they are just the two ways Apple authenticates the
          # notarization service.
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m
            rm -f "$RUNNER_TEMP/notary.p8"
          elif [ -n "$NOTARY_APPLE_ID" ]; then
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID" \
              --wait --timeout 30m
          else
            echo "a signing certificate is configured but no notarization credentials are" >&2
            echo "set NOTARY_KEY_P8/NOTARY_KEY_ID/NOTARY_ISSUER_ID, or" >&2
            echo "NOTARY_APPLE_ID/NOTARY_PASSWORD/NOTARY_TEAM_ID" >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple build/Yami.app
          xcrun stapler validate build/Yami.app
          # The check a user's Mac performs on first launch.
          spctl -a -t exec -vvv build/Yami.app

      # ditto rather than zip: it preserves the bundle's symlinks and the code
      # signature, which a plain zip mangles.
      - name: Package
        if: env.SIGNED == 'true' && github.event_name == 'push'
        run: ditto -c -k --sequesterRsrc --keepParent build/Yami.app "$ASSET"

      # One rolling release replaced on every push, rather than one release per
      # commit: the useful artefact is "the latest build", and per-commit
      # releases accumulate without bound. Tagged `canary` — the widely used
      # name for a build cut from every change. Not `latest`, which collides
      # with GitHub's own /releases/latest (that ignores prereleases).
      - name: Publish canary release
        if: env.SIGNED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s)"
          cat > notes.md <<NOTES
          Automatic build of \`main\` — replaced on every push.

          **Commit** [\`$(git rev-parse --short HEAD)\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) — $SUBJECT
          **Version** ${YAMI_VERSION} (build ${YAMI_BUILD})

          ---

          ### Read before installing

          This build is **ad-hoc signed**, because CI has no Developer ID certificate.
          Two consequences:

          1. **The System Proxy toggle will not work.** The privileged helper only accepts
             connections from a binary signed with the project's Apple team ID, and an
             ad-hoc build has none. Running the core and managing the subscription work
             normally.
          2. **Gatekeeper will refuse to open it**, since it is neither signed with a
             Developer ID nor notarized. To run it anyway:

             \`\`\`bash
             xattr -dr com.apple.quarantine /Applications/Yami.app
             \`\`\`

          For a build with a working system proxy, build locally with \`./build.sh release\`
          using your own signing identity.
          NOTES
          gh release delete canary --cleanup-tag --yes 2>/dev/null || true
          gh release create canary "$ASSET" \
            --title "Canary (${YAMI_VERSION})" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Publish tagged release
        if: env.SIGNED == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "### Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --pretty='- %s' "${PREVIOUS}..${GITHUB_REF_NAME}"
            else
              git log --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo "Signed with a Developer ID certificate and notarized by Apple, so it opens"
            echo "without warnings. Unzip and drag \`Yami.app\` to Applications."
            echo
            echo "Requires macOS 14 or later on Apple Silicon. The mihomo core is bundled;"
            echo "nothing else needs installing."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" "$ASSET" \
            --title "Yami ${YAMI_VERSION}" \
            --notes-file notes.md \
            --target "${{ github.sha }}"
